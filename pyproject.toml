[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "kira-desktop"
version = "0.16.0.dev1"
description = "A durable native workspace for local AI, Codex and direct OpenAI agents"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6-Essentials==6.11.2",
    "httpx==0.28.1",
    "markdown-it-py==4.0.0",
    "pydantic==2.12.5",
    "PyJWT[crypto]==2.15.1",
    "playwright==1.64.0",
]

[project.scripts]
kira-desktop = "kira.cli:main"
kira-service = "kira.service.server:main"

[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.15.6", "mypy==1.19.1", "pytest-qt==4.5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/kira"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["build", "dist"]
