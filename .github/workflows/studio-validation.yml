name: Studio isolated validation
on:
  push:
    branches: [feature/kira-studio]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/studio-validation.yml'
permissions:
  contents: read
concurrency:
  group: studio-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    if: github.ref == 'refs/heads/feature/kira-studio'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      KIRA_HOME: ${{ github.workspace }}/build/ci-profile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive exactly the tracked source (no credentials or user profile)
        run: |
          mkdir -p "$RUNNER_TEMP/studio-source"
          git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/studio-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/studio-source/COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-source-${{ github.sha }}
          path: ${{ runner.temp }}/studio-source/
          retention-days: 3
      - name: Prepare isolated build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/build-env"
          "$RUNNER_TEMP/build-env/bin/pip" install uv==0.12.23
          echo "$RUNNER_TEMP/build-env/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Offline wheel bundle for independent verification
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          "$RUNNER_TEMP/build-env/bin/pip" download --only-binary=:all: -r "$RUNNER_TEMP/requirements.txt" -d "$RUNNER_TEMP/wheelhouse"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-test-wheels-${{ github.sha }}
          path: ${{ runner.temp }}/wheelhouse/
          retention-days: 3
      - name: Install headless Qt system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core
      - name: Static and publication checks
        run: |
          uv run ruff check src tests scripts packaging
          uv run mypy src
          python3 scripts/check_translations.py
          python3 scripts/check_public_tree.py
      - name: Studio and provider regressions
        run: uv run pytest tests/test_studio_*.py tests/test_ui_external_links.py tests/test_ui_direct_account.py -q --junitxml=build/studio-results.xml
      - name: Complete synthetic suite
        run: uv run pytest tests -q --junitxml=build/all-results.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: studio-test-results-${{ github.sha }}
          path: build/*-results.xml
          if-no-files-found: ignore
          retention-days: 7
