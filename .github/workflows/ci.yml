name: CI
on:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Static and publication checks
    if: github.repository_owner == 'antosec00' && (!github.event.repository.private || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, kira-wsl2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare isolated build tools
        run: |
          if [ -x "$HOME/.local/bin/uv" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            python3 -m venv "$RUNNER_TEMP/build-env"
            "$RUNNER_TEMP/build-env/bin/pip" install uv==0.12.23
            echo "$RUNNER_TEMP/build-env/bin" >> "$GITHUB_PATH"
          fi
      - name: Install locked dependencies
        run: uv sync --frozen --extra claude-code
      - name: Lock files are current
        run: |
          uv lock --check
          # The packaging lock is the exported runtime lock (header comments aside).
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --quiet \
            | grep -v '^#' | diff -u <(grep -v '^#' packaging/requirements.lock.txt) -
      - name: Lint
        run: uv run ruff check src tests scripts packaging
      - name: Type check
        run: uv run mypy src
      - name: Translation catalogs
        run: python3 scripts/check_translations.py
      - name: Public tree review
        run: python3 scripts/check_public_tree.py
  tests:
    name: Synthetic test suite (offscreen Qt)
    if: github.repository_owner == 'antosec00' && (!github.event.repository.private || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, kira-wsl2]
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      KIRA_HOME: ${{ github.workspace }}/build/ci-profile
      CLOUDSDK_CONFIG: ${{ runner.temp }}/ci-gcloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Prepare isolated build tools
        run: |
          if [ -x "$HOME/.local/bin/uv" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            python3 -m venv "$RUNNER_TEMP/build-env"
            "$RUNNER_TEMP/build-env/bin/pip" install uv==0.12.23
            echo "$RUNNER_TEMP/build-env/bin" >> "$GITHUB_PATH"
          fi
      - name: Install headless Qt system libraries
        run: |
          if dpkg -s libegl1 libgl1 libxkbcommon0 libdbus-1-3 >/dev/null 2>&1; then
            echo "Headless Qt system libraries already installed on host."
          else
            sudo apt-get update -qq && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 fonts-noto-core
          fi
      - name: Install locked dependencies
        run: uv sync --frozen --extra claude-code
      - name: Run the suite
        run: uv run pytest tests -q -p no:cacheprovider --durations=15

